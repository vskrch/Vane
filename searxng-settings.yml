use_default_settings: true
general:
  instance_name: "Perplexica Search"
  debug: false
  privacypolicy_url: false
  contact_url: false
  enable_metrics: false
search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json
server:
  secret_key: "vane-searxng-secret-key-change-me"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  http_protocol_version: "1.0"
  method: "GET"
outgoing:
  request_timeout: 7.0
  max_request_timeout: 12.0
  useragent_suffix: ""
  keepalive_expiry: 5.0
  proxies: {}
engines:
  - name: google
    disabled: false
  - name: duckduckgo
    disabled: false
    shortcut: ddg
  - name: bing
    disabled: false
  - name: wikipedia
    disabled: false
  - name: brave
    disabled: true
